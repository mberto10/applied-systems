<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>$title</title>
<style>
:root{--bg:#17130E;--ink:#EDE4D3;--soft:#D9CDB6;--muted:#BFB39C;--line:#4A4136;--accent:#F2A900;
--display:"Bodoni 72","Didot","Bodoni MT","Bodoni Moda",Georgia,serif;--text:"Iowan Old Style","Charter",Georgia,serif;--label:"Avenir Next Condensed","DIN Condensed","Arial Narrow",sans-serif}
@media (prefers-color-scheme:light){:root{--bg:#F4EEE3;--ink:#1B1712;--soft:#3A3229;--muted:#6B5F4C;--line:#CDBFA6;--accent:#A35F00}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:17px/1.5 var(--text);background:var(--bg);background-image:radial-gradient(ellipse at 15% -10%,rgba(242,169,0,.14),transparent 55%),radial-gradient(ellipse at 110% 40%,rgba(194,74,30,.12),transparent 50%);min-height:100vh}
main{max-width:1180px;margin:0 auto;padding:36px 20px 64px}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
header{animation:up .6s ease both}
.edition{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font:600 13px/1.3 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:10px 0 0;font:italic 400 clamp(56px,10vw,108px)/.9 var(--display);letter-spacing:-.03em;text-align:center;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);padding:18px 0 14px}
.dateline{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font:500 14px/1.4 var(--label);letter-spacing:.04em;border-bottom:3px solid var(--ink);padding:10px 0}
.overview{margin:18px 0 0;font-size:18px;color:var(--soft)}
.overview:empty{display:none}
.toggle{position:absolute;opacity:0;pointer-events:none}
.why-toggle{display:inline-block;margin-top:16px;font:600 12px/1 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:1px dotted var(--muted)}
.why{display:none}
#why:checked~section .why{display:block}
#why:checked+.why-toggle{color:var(--accent);border-color:var(--accent)}
.kicker{margin:0 0 8px;font:600 12px/1.3 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
article h3{margin:0;font-family:var(--display);font-weight:600;letter-spacing:-.01em}
article h3 a{color:inherit;text-decoration:none}
article h3 a:hover{text-decoration:underline;text-decoration-color:var(--accent)}
a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.sum{margin:8px 0 0;color:var(--soft)}
.why{margin:8px 0 0;font:500 13px/1.4 var(--label);letter-spacing:.03em;color:var(--muted)}
.caveat{margin:6px 0 0;font-size:14px;color:var(--muted)}
.caveat::before{content:"Note: ";font-weight:600}
.top{display:flex;flex-wrap:wrap;gap:32px;margin-top:32px;animation:up .6s ease both;animation-delay:.1s}
.lead{flex:2 1 520px;min-width:0}
.lead.video::before{content:"▶";display:flex;align-items:center;justify-content:center;aspect-ratio:16/7;margin-bottom:16px;background:linear-gradient(160deg,#1E2A2F,#2F5D62);color:var(--ink);font-size:40px}
.lead h3{font-size:clamp(32px,4vw,46px);line-height:1.05}
.lead .sum{font-size:19px}
.side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:22px}
.second{padding-bottom:20px;border-bottom:1px solid var(--line)}
.second:last-child{border-bottom:0}
.second h3{font-size:28px;line-height:1.1}
.row{margin-top:40px;animation:up .6s ease both;animation-delay:.25s}
.row h2{display:flex;align-items:center;gap:16px;margin:0 0 16px;font:800 22px/1 var(--label);letter-spacing:.08em;text-transform:uppercase}
.row h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.card{border-top:3px solid var(--accent);padding-top:12px}
.card h3{font-size:24px;line-height:1.15}
.card.video::before{content:"▶";display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;margin-bottom:12px;background:linear-gradient(160deg,#1E2A2F,#2F5D62);color:var(--ink);font-size:32px}
.empty{font:italic 28px/1.4 var(--display);color:var(--muted);padding:48px 0;text-align:center}
.held{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;font:500 14px/1.4 var(--label)}
.held summary{cursor:pointer;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.held ul{display:flex;flex-wrap:wrap;gap:8px 28px;list-style:none;padding:0;margin:12px 0}
.held li span::after{content:" · "}
footer{margin-top:40px;font-size:14px;color:var(--muted)}
footer:empty{display:none}
footer p{margin:.4em 0}
.diag summary{cursor:pointer;list-style:none;display:inline-block;border-bottom:1px dotted var(--muted)}
.diag summary::-webkit-details-marker{display:none}
.diag[open] summary{margin-bottom:6px}
</style></head>
<body><main>
<header>
<div class="edition"><span>$meta</span></div>
<h1>$title</h1>
<p class="overview">$overview</p>
</header>
$content
<footer>$notices</footer>
</main></body></html>
